name: Bootstrap Territory PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  unpack:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/territory-mvp'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct, verify, and unpack source
        if: ${{ hashFiles('.bootstrap/chunk-*') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/hometerritory.tar.gz.b64
          base64 --decode /tmp/hometerritory.tar.gz.b64 > /tmp/hometerritory.tar.gz
          echo "89ebe4a37ab9e5c5731ad257342959a12d07ab68b5926c15c80034dbe9c14387  /tmp/hometerritory.tar.gz" | sha256sum --check
          tar -xzf /tmp/hometerritory.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: build connected Territory MVP"
          git push origin HEAD:${{ github.head_ref }}
