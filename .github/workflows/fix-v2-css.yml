name: Fix map-first CSS scope

on:
  push:
    branches: [codex/map-first-redesign]
    paths: [.github/workflows/fix-v2-css.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-first-redesign
      - name: Scope reduced-motion rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/territory-game-v2.module.css')
          text = path.read_text()
          old = '@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}'
          new = '@media(prefers-reduced-motion:reduce){.app *,.authPage *,.entryPage *,.lobbyPage *,.questionPage *,.resultPage *,.loading *{animation:none!important;transition:none!important}}'
          if old not in text:
              raise SystemExit('target rule not found')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/fix-v2-css.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CSS module reduced-motion selector"
          git push origin HEAD:codex/map-first-redesign
