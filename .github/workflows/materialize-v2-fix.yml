name: Materialize map-first CSS fix

on:
  push:
    branches: [codex/map-first-redesign]
    paths:
      - '.bootstrap/v2fix/**'
      - '.github/workflows/materialize-v2-fix.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-first-redesign
      - name: Replace CSS module
        run: |
          cat .bootstrap/v2fix/part-* > /tmp/v2fix.b64
          base64 --decode /tmp/v2fix.b64 > /tmp/v2fix.tar.gz
          tar -xzf /tmp/v2fix.tar.gz -C .
          rm -rf .bootstrap/v2fix
          rm -f .github/workflows/materialize-v2-fix.yml
          rm -f .github/workflows/fix-v2-css.yml
      - name: Commit corrected CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix map-first CSS module build"
          git push origin HEAD:codex/map-first-redesign
