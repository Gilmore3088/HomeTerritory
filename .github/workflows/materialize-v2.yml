name: Materialize map-first redesign

on:
  push:
    branches: [codex/map-first-redesign]
    paths:
      - '.bootstrap/v2/**'
      - '.github/workflows/materialize-v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/map-first-redesign
      - name: Rebuild source files
        run: |
          cat .bootstrap/v2/part-* > /tmp/territory-v2.b64
          base64 --decode /tmp/territory-v2.b64 > /tmp/territory-v2.tar.gz
          tar -xzf /tmp/territory-v2.tar.gz -C .
          rm -rf .bootstrap/v2
          rm -f .github/workflows/materialize-v2.yml
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Territory as a map-first game" || exit 0
          git push origin HEAD:codex/map-first-redesign
